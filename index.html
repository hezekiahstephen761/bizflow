          }
        ];
        const seedOrders = [
          {
            id: "sample-order-1", businessId: "sample-table", productId: "mina-cake", productName: "Celebration cake",
            customerName: "Ama Owusu", customerPhone: "+233 20 000 0201", quantity: 1, price: 320, cost: 190,
            currency: "GHS", fulfilment: "Pickup", dueAt: new Date(Date.now() + 19 * 60 * 60 * 1000).toISOString(),
            note: "Vanilla, simple flowers on top.", status: "pending", demo: true, createdAt: new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString()
          },
          {
            id: "sample-order-2", businessId: "sample-table", productId: "mina-tray", productName: "Sunday lunch tray",
            customerName: "Kojo A.", customerPhone: "+233 20 000 0202", quantity: 2, price: 180, cost: 95,
            currency: "GHS", fulfilment: "Delivery", dueAt: new Date(Date.now() + 44 * 60 * 60 * 1000).toISOString(),
            note: "Please confirm the delivery area.", status: "accepted", demo: true, createdAt: new Date(Date.now() - 6 * 60 * 60 * 1000).toISOString()
          },
          {
            id: "sample-order-3", businessId: "sample-table", productId: "mina-bites", productName: "Party bites · 24 pcs",
            customerName: "Efua Mensah", customerPhone: "+233 20 000 0203", quantity: 1, price: 240, cost: 135,
            currency: "GHS", fulfilment: "Pickup", dueAt: new Date(Date.now() - 30 * 60 * 60 * 1000).toISOString(),
            note: "", status: "done", demo: true, createdAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()
          }
        ];

        const app = document.getElementById("app");
        const toastRegion = document.getElementById("toastRegion");
        const orderDialog = document.getElementById("orderDialog");
        const productDialog = document.getElementById("productDialog");
        const encoder = new TextEncoder();
        const decoder = new TextDecoder();
        let sessionBusinessId = null;
        let sessionBankDetails = null;
        let route = "explore";
        let selectedCategory = "All";
        let searchTerm = "";
        let selectedBusinessId = null;
        let toastTimer;
        let persistenceAvailable = true;

        function clone(value) {
          return JSON.parse(JSON.stringify(value));
        }

        function escapeHtml(value) {
          return String(value ?? "").replace(/[&<>"']/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
          })[character]);
        }

        function randomId(prefix) {
          return `${prefix}-${crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`}`;
        }

        function readStore() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { businesses: clone(seedBusinesses), orders: clone(seedOrders), customerOrderIds: [] };
            const parsed = JSON.parse(raw);
            if (!parsed || !Array.isArray(parsed.businesses) || !Array.isArray(parsed.orders)) {
              throw new Error("Saved BizFlow data has an unexpected format.");
            }
            const businesses = [...clone(seedBusinesses), ...parsed.businesses.filter(item => !item.demo)];
            const orders = [...clone(seedOrders), ...parsed.orders.filter(item => !item.demo)];
            const orderIds = Array.isArray(parsed.customerOrderIds) ? parsed.customerOrderIds : [];
            return {
              businesses,
              orders,
              customerOrderIds: [...new Set(orderIds.filter(id => typeof id === "string" && orders.some(order => order.id === id && !order.demo)))]
            };
          } catch (error) {
            persistenceAvailable = false;
            console.error("Could not read BizFlow's local demo data.", error);
            return { businesses: clone(seedBusinesses), orders: clone(seedOrders), customerOrderIds: [] };
          }
        }

        const store = readStore();
        const localOrderIds = new Set(store.customerOrderIds);

        function persistStore() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              businesses: store.businesses.filter(item => !item.demo),
              orders: store.orders.filter(item => !item.demo),
              customerOrderIds: [...localOrderIds]
            }));
            persistenceAvailable = true;
          } catch (error) {
            persistenceAvailable = false;
            console.error("Could not save BizFlow's local demo data.", error);
            throw new Error("This browser could not save the change. Check its storage settings and try again.");
          }
        }

        function showToast(message, kind = "success", link = null) {
          clearTimeout(toastTimer);
          const toast = document.createElement("div");
          toast.className = `toast${kind === "error" ? " error" : ""}`;
          toast.setAttribute("role", kind === "error" ? "alert" : "status");
          toast.textContent = message;
          if (link) {
            const anchor = document.createElement("a");
            anchor.href = link.href;
            anchor.target = "_blank";
            anchor.rel = "noopener noreferrer";
            anchor.textContent = link.label;
            toast.append(document.createElement("br"), anchor);
          }
          toastRegion.replaceChildren(toast);
          toastTimer = setTimeout(() => toast.remove(), 7500);
        }

        function currentBusiness() {
          return store.businesses.find(business => business.id === sessionBusinessId) || null;
        }

        function businessById(id) {
          return store.businesses.find(business => business.id === id) || null;
        }

        function formatMoney(amount, currency = "GHS") {
          const numericAmount = Number(amount) || 0;
          try {
            return new Intl.NumberFormat(undefined, { style: "currency", currency, maximumFractionDigits: 2 }).format(numericAmount);
          } catch {
            return `${currency} ${numericAmount.toFixed(2)}`;
          }
        }

        function formatDate(value, options = {}) {
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return "Time to confirm";
          return new Intl.DateTimeFormat(undefined, {
            weekday: options.long ? "long" : "short",
            month: "short",
            day: "numeric",
            ...(options.time ? { hour: "numeric", minute: "2-digit" } : {})
          }).format(date);
        }

        function relativeDeadline(value) {
          const hours = (new Date(value).getTime() - Date.now()) / 3600000;
          if (!Number.isFinite(hours)) return "";
          if (hours < 0) return `Past due · ${formatDate(value, { time: true })}`;
          if (hours < 24) return `Due soon · ${formatDate(value, { time: true })}`;
          return formatDate(value, { time: true });
        }

        function statusLabel(status) {
          return ({ pending: "Awaiting decision", accepted: "Accepted", done: "Done", declined: "Declined" })[status] || "Pending";
        }

        function statusMarkup(status, dueAt = null) {
          const hours = dueAt ? (new Date(dueAt).getTime() - Date.now()) / 3600000 : null;
          const late = status === "accepted" && hours !== null && hours < 0;
          const soon = status === "accepted" && hours !== null && hours >= 0 && hours < 24;
          const className = late ? "late" : soon ? "soon" : (["pending", "accepted", "done", "declined"].includes(status) ? status : "");
          return `<span class="status ${className}">${late ? "Overdue" : soon ? "Due soon" : escapeHtml(statusLabel(status))}</span>`;
        }

        function toWhatsApp(phone, text) {
          const digits = String(phone || "").replace(/\D/g, "");
          if (digits.length < 8 || digits.length > 15) return null;
          return `https://wa.me/${digits}?text=${encodeURIComponent(text)}`;
        }

        function allBusinessOrders(businessId) {
          return store.orders.filter(order => order.businessId === businessId);
        }

        function navActive(view) {
          if (view === "orders") return route === "my-orders";
          if (view === "studio") return route === "studio";
          return route === "explore" || route === "business";
        }

        function navButton(view, label, icon, count = null) {
          return `<button type="button" class="rail-link${navActive(view) ? " active" : ""}" data-action="navigate" data-view="${view}" aria-label="${escapeHtml(label)}">
            <span class="rail-icon" aria-hidden="true">${icon}</span><span>${label}</span>${count ? `<b class="rail-count">${count}</b>` : ""}
          </button>`;
        }

        function mobileNav() {
          const items = [
            ["explore", "⌕", "Explore"],
            ["orders", "▤", "My orders"],
            [currentBusiness() ? "studio" : "auth", "◫", currentBusiness() ? "Studio" : "Owner"]
          ];
          return `<nav class="mobile-nav" aria-label="Main navigation">${items.map(([view, icon, label]) => {
            const active = (view === "orders" && route === "my-orders") ||
              (view === "studio" && route === "studio") ||
              (view === "explore" && (route === "explore" || route === "business")) ||
              (view === "auth" && route === "auth");
            return `<button type="button" class="${active ? "active" : ""}" data-action="${view === "auth" ? "navigate" : "navigate"}" data-view="${view}">
              <span class="mobile-icon" aria-hidden="true">${icon}</span>${label}
            </button>`;
          }).join("")}</nav>`;
        }

        function shellMarkup() {
          const business = currentBusiness();
          const pendingCount = business ? allBusinessOrders(business.id).filter(order => order.status === "pending").length : 0;
          return `<div class="app-shell">
            <aside class="side-rail" aria-label="BizFlow navigation">
              <a class="brand-lockup" href="#" data-action="navigate" data-view="explore" aria-label="BizFlow home">
                <span class="brand-mark" aria-hidden="true">B</span><span class="brand-copy"><span class="brand-name">BizFlow</span><span class="brand-caption">the work, in motion</span></span>
              </a>
              <div class="rail-label">Workspace</div>
              <nav class="rail-nav" aria-label="Main navigation">
                ${navButton("explore", "Explore businesses", "⌕")}
                ${navButton("orders", "My orders", "▤", localOrderIds.size || null)}
                ${navButton(business ? "studio" : "auth", business ? "Business studio" : "Owner sign in", "◫", business && pendingCount ? pendingCount : null)}
              </nav>
              <div class="rail-spacer"></div>
              <div class="rail-demo"><strong>Prototype workspace</strong><p>Demo listings are synthetic. New profiles and orders stay in this browser.</p></div>
              <div class="rail-foot"><span class="live-dot" aria-hidden="true"></span><span>Local demo · no live provider connected</span></div>
            </aside>
            <div class="workspace">
              <header class="topbar">
                <a class="mobile-brand" href="#" data-action="navigate" data-view="explore"><span class="brand-mark" aria-hidden="true">B</span>BizFlow</a>
                <label class="search-box" for="globalSearch">
                  <span class="search-symbol" aria-hidden="true">⌕</span>
                  <input id="globalSearch" type="search" value="${escapeHtml(searchTerm)}" placeholder="Find a maker, product, or service" aria-label="Search businesses and offers" />
                </label>
                <div class="topbar-actions">
                  <span class="topbar-note">${business ? `Studio · ${escapeHtml(business.name)}` : "Made for independent businesses"}</span>
                  ${business
                    ? `<button type="button" class="button secondary small" data-action="logout">Sign out</button>`
                    : `<button type="button" class="button secondary small" data-action="navigate" data-view="auth">Owner sign in</button>`}
                </div>
              </header>
              <main id="mainContent" class="content motion-in">${renderRoute()}</main>
              ${mobileNav()}
            </div>
          </div>`;
        }

        function renderExplore() {
          const businessList = store.businesses.filter(business => {
            const matchesCategory = selectedCategory === "All" || business.category === selectedCategory;
            const haystack = `${business.name} ${business.category} ${business.location} ${business.services} ${business.products.map(product => product.name).join(" ")}`.toLowerCase();
            return matchesCategory && haystack.includes(searchTerm.toLowerCase());
          });
          return `<section aria-labelledby="exploreTitle">
            <div class="page-heading">
              <div><h1 id="exploreTitle">Good work, clearly ordered.</h1><p>Find independent makers and services, then agree on the details one order at a time.</p></div>
              <div class="heading-actions"><button type="button" class="button" data-action="navigate" data-view="auth">List your business <span aria-hidden="true">↗</span></button></div>
            </div>
            <section class="route-board" aria-label="How a BizFlow order moves">
              <div class="route-copy">
                <h2>Every good order has a next step.</h2>
                <p>Browse a local offer. Ask for the date you need. The owner confirms the work before it becomes a booking.</p>
                <button type="button" class="button" data-action="focus-search">Find something nearby <span aria-hidden="true">→</span></button>
              </div>
              <div class="ticket-stage" aria-label="Example order ticket, synthetic demonstration">
                <div class="ticket">
                  <div class="ticket-head"><div><small>Sample work ticket · synthetic</small><strong>Celebration cake</strong></div><span class="ticket-stamp">REQUESTED</span></div>
                  <div class="ticket-steps"><div class="ticket-step current">Request</div><div class="ticket-step">Owner confirms</div><div class="ticket-step">Ready / done</div></div>
                  <div class="ticket-meta"><span>Requested slot</span><strong>Owner confirms timing</strong></div>
                </div>
              </div>
            </section>
            <div class="section-heading">
              <div><h2>Meet the makers</h2><p>Browse sample businesses and their offers. Demo names and prices are synthetic.</p></div>
              <span class="business-category">${businessList.length} ${businessList.length === 1 ? "business" : "businesses"}</span>
            </div>
            <div class="filter-row" role="group" aria-label="Filter by business type">
              ${categories.map(category => `<button type="button" class="filter-chip${selectedCategory === category ? " active" : ""}" data-action="filter-category" data-category="${escapeHtml(category)}" aria-pressed="${selectedCategory === category}">${escapeHtml(category)}</button>`).join("")}
            </div>
            ${businessList.length ? `<div class="business-grid">${businessList.map(renderBusinessCard).join("")}</div>` :
              `<div class="panel empty-state"><strong>No matching businesses yet.</strong><p>Try a different search or category.</p><button class="button secondary small" type="button" data-action="clear-search">Clear filters</button></div>`}
            <p class="prototype-footnote">BizFlow is a browser-only prototype. Sample profiles, people, and prices are fictional; use test data only.</p>
          </section>`;
        }

        function renderBusinessCard(business) {
          const theme = categoryThemes[business.category] || "service";
          const icon = categoryIcons[business.category] || "✳";
          return `<article class="business-card">
            <div class="business-art ${theme}"><span class="art-label">${escapeHtml(business.category)}</span><span class="art-symbol" aria-hidden="true">${icon}</span>${business.demo ? `<span class="demo-tag">Synthetic sample</span>` : ""}</div>
            <div class="business-card-body">
              <div class="business-title-row"><h3>${escapeHtml(business.name)}</h3><span class="business-category">${escapeHtml(business.products.length)} offers</span></div>
              <p class="business-summary">${escapeHtml(business.services || business.about)}</p>
              <div class="business-foot"><span class="business-place"><strong>${escapeHtml(business.location)}</strong></span><button type="button" class="open-business" data-action="open-business" data-id="${escapeHtml(business.id)}">View offers <span aria-hidden="true">→</span></button></div>
            </div>
          </article>`;
        }

        function renderBusinessProfile() {
          const business = businessById(selectedBusinessId);
          if (!business) {
            route = "explore";
            return renderExplore();
          }
          const theme = categoryThemes[business.category] || "service";
          const isOwner = currentBusiness()?.id === business.id;
          return `<section aria-labelledby="businessTitle">
            <div class="page-heading"><div><button type="button" class="text-button" data-action="navigate" data-view="explore">← Back to explore</button></div></div>
            <div class="profile-banner">
              <div><span class="business-category">${escapeHtml(business.category)}${business.demo ? " · synthetic sample" : ""}</span><h1 id="businessTitle">${escapeHtml(business.name)}</h1><p>${escapeHtml(business.about || business.services)}</p>
                <div class="profile-meta"><span>⌖ ${escapeHtml(business.location)}</span><span>Offers ${business.products.length} products &amp; services</span></div>
              </div>
              <div class="profile-contact"><a class="button secondary" href="tel:${escapeHtml(business.phone.replace(/[^\d+]/g, ""))}">Call ${escapeHtml(business.phone)}</a>${isOwner ? `<button class="button" type="button" data-action="navigate" data-view="studio">Open my studio</button>` : ""}</div>
            </div>
            <div class="section-heading"><div><h2>Products &amp; services</h2><p>Prices are shown by the business; confirm availability and timing before paying.</p></div></div>
            ${business.products.length ? `<div class="product-grid">${business.products.map(product => renderProductCard(business, product, isOwner)).join("")}</div>` :
              `<div class="panel empty-state"><strong>No offers listed yet.</strong><p>Check back with this business another time.</p></div>`}
            <div class="split-layout" style="margin-top:20px;">
              <section class="panel panel-pad"><div class="panel-title"><div><h2>What they do</h2><p>Ask the owner about details that matter for your order.</p></div></div><p style="margin:0;color:var(--ink-soft);font-size:13px;">${escapeHtml(business.services || business.about)}</p></section>
              <section class="panel panel-pad"><div class="panel-title"><div><h2>Contact</h2><p>The public business phone is visible to customers.</p></div></div><div class="business-info"><div class="info-row"><span>Phone</span><strong>${escapeHtml(business.phone)}</strong></div><div class="info-row"><span>Location</span><strong>${escapeHtml(business.location)}</strong></div><div class="payment-note">Bank details are private. They are never shown on a public profile; an owner may include them in a one-to-one WhatsApp acceptance message.</div></div></section>
            </div>
          </section>`;
        }

        function renderProductCard(business, product, isOwner) {
          const theme = categoryThemes[business.category] || "service";
          return `<article class="product-card">
            <div class="product-art ${theme}"><span class="product-emoji" aria-hidden="true">${escapeHtml(product.icon || categoryIcons[business.category] || "✳")}</span></div>
            <div class="product-body"><h3>${escapeHtml(product.name)}</h3><p>${escapeHtml(product.description || "Details and timing confirmed with the owner.")}</p>
              <div class="product-foot"><span class="price">${formatMoney(product.price, business.currency)}</span>
                ${isOwner ? `<span class="status">Your offer</span>` : `<button class="button small" type="button" data-action="request-order" data-business="${escapeHtml(business.id)}" data-product="${escapeHtml(product.id)}">Request order</button>`}
              </div>
            </div>
          </article>`;
        }

        function orderCard(order, ownerView = false) {
          const dueText = relativeDeadline(order.dueAt);
          const quantityText = `${order.quantity} × ${formatMoney(order.price, order.currency)}`;
          const total = formatMoney(order.quantity * order.price, order.currency);
          const detail = ownerView ? `<span>From ${escapeHtml(order.customerName)}</span><span>${escapeHtml(order.customerPhone)}</span>` :
            `<span>${escapeHtml(businessById(order.businessId)?.name || "Business")}</span><span>${escapeHtml(order.fulfilment)}</span>`;
          const actions = ownerView
            ? ownerOrderActions(order)
            : customerOrderActions(order);
          return `<article class="order-row">
            <div class="order-main">
              <div class="order-titleline"><strong>${escapeHtml(order.productName)}</strong>${statusMarkup(order.status, order.dueAt)}${order.demo ? `<span class="demo-tag">Sample</span>` : ""}</div>
              <div class="order-details">${detail}<span>${escapeHtml(quantityText)} · ${escapeHtml(total)}</span><span>${escapeHtml(dueText)}</span></div>
              <div class="order-details"><span>${escapeHtml(order.fulfilment)} requested</span></div>
              ${order.note ? `<p class="order-note">${escapeHtml(order.note)}</p>` : ""}
              ${order.status === "accepted" && !ownerView ? `<p class="order-note">The owner has accepted this request. Confirm payment and handoff directly with them.</p>` : ""}
              ${order.status === "declined" && !ownerView ? `<p class="order-note">This request was declined. Contact the business to discuss another time.</p>` : ""}
            </div>
            <div class="order-actions">${actions}</div>
          </article>`;
        }

        function ownerOrderActions(order) {
          if (order.status === "pending") {
            return `<button class="button small" type="button" data-action="accept-order" data-id="${escapeHtml(order.id)}">Accept &amp; schedule</button><button class="button danger small" type="button" data-action="decline-order" data-id="${escapeHtml(order.id)}">Decline</button>`;
          }
          if (order.status === "accepted") {
            const message = acceptedMessage(order);
            const link = toWhatsApp(order.customerPhone, message);
            return `${link ? `<a class="button secondary small" href="${link}" target="_blank" rel="noopener noreferrer">Message customer</a>` : `<button class="button secondary small" type="button" data-action="copy-customer-message" data-id="${escapeHtml(order.id)}">Copy confirmation</button>`}<button class="button small" type="button" data-action="complete-order" data-id="${escapeHtml(order.id)}">Mark done</button>`;
          }
          return `<span class="status ${order.status === "done" ? "done" : "declined"}">${order.status === "done" ? `Profit ${formatMoney(order.quantity * (order.price - (Number(order.cost) || 0)), order.currency)}` : "Closed"}</span>`;
        }

        function customerOrderActions(order) {
          const business = businessById(order.businessId);
          const message = orderRequestMessage(order, business);
          const link = business && toWhatsApp(business.phone, message);
          return `${link ? `<a class="button secondary small" href="${link}" target="_blank" rel="noopener noreferrer">Open WhatsApp</a>` : `<span class="field-hint">WhatsApp contact needs an international number.</span>`}${business ? `<a class="text-button" href="tel:${escapeHtml(business.phone.replace(/[^\d+]/g, ""))}">Call owner</a>` : ""}`;
        }

        function acceptedMessage(order) {
          const business = currentBusiness();
          const payment = sessionBankDetails?.accountNumber
            ? `\n\nPayment details (sent privately by the owner): ${sessionBankDetails.bankName}, ${sessionBankDetails.accountName}, account ${sessionBankDetails.accountNumber}.`
            : "\n\nPlease contact me directly to arrange payment.";
          return `Hello ${order.customerName}, I can accept your ${order.productName} order for ${formatDate(order.dueAt, { time: true })}. Total: ${formatMoney(order.quantity * order.price, order.currency)}. ${order.fulfilment} is noted.${payment}${business ? `\n\n${business.name}` : ""}`;
        }

        function orderRequestMessage(order, business) {
          return `Hello ${business?.ownerName || "there"}, I'd like to request ${order.quantity} × ${order.productName} (${formatMoney(order.quantity * order.price, order.currency)}). Requested ${order.fulfilment.toLowerCase()} by ${formatDate(order.dueAt, { time: true })}.${order.note ? ` Details: ${order.note}` : ""} Please confirm whether you can accept and the final timing.`;
        }

        function renderCustomerOrders() {
          const orders = store.orders.filter(order => localOrderIds.has(order.id)).sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));
          return `<section>
            <div class="page-heading"><div><h1>My order requests</h1><p>Requests saved on this browser. The business confirms availability and the final schedule with you.</p></div><button class="button secondary" type="button" data-action="navigate" data-view="explore">Find a business</button></div>
            <div class="panel panel-pad"><div class="panel-title"><div><h2>Order timeline</h2><p>Keep the WhatsApp conversation and this local status in sync.</p></div></div>
              ${orders.length ? `<div class="order-list">${orders.map(order => orderCard(order)).join("")}</div>` :
                `<div class="empty-state"><strong>No orders here yet.</strong><p>Choose an offer to request a date and time.</p><button class="button" type="button" data-action="navigate" data-view="explore">Explore businesses</button></div>`}
            </div>
            <p class="prototype-footnote">Order requests are stored only in this browser demo. They are not shared with a business unless you send the WhatsApp message.</p>
          </section>`;
        }

        function renderAuth() {
          return `<section class="auth-layout">
            <div class="auth-intro"><button class="text-button" type="button" data-action="navigate" data-view="explore">← Back to explore</button><h1>Bring every order into view.</h1><p>Set up your business once, share your offers, then keep requests and due dates together in your studio.</p>
              <div class="auth-points"><div class="auth-point"><span class="point-mark">1</span><span>Customers see your offers, service area, and business phone.</span></div><div class="auth-point"><span class="point-mark">2</span><span>You decide which requests to accept and schedule.</span></div><div class="auth-point"><span class="point-mark">3</span><span>Mark completed work done and review the estimate.</span></div></div>
            </div>
            <div class="panel form-card">
              <h2 id="authTitle">Owner sign in</h2><p id="authDescription">Pick up where your business left off.</p>
              <form id="loginForm">
                <div class="form-grid">
                  <div class="field full"><label for="loginUsername">Username</label><input id="loginUsername" name="username" autocomplete="username" maxlength="40" required /></div>
                  <div class="field full"><label for="loginPassword">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" minlength="8" required /></div>
                </div>
                <div class="form-actions"><button class="text-button" type="button" data-action="demo-login">Open the synthetic demo studio</button><button class="button" type="submit">Sign in</button></div>
              </form>
              <div class="auth-switch">New to BizFlow? <button type="button" data-action="show-signup">Create a business account</button></div>
              <div class="secure-note">Prototype only: accounts and orders stay in this browser. Password verifiers use PBKDF2 and payment details are encrypted locally, but this is not production authentication or secure bank storage. Use test information only.</div>
            </div>
          </section>`;
        }

        function renderSignup() {
          return `<section class="auth-layout">
            <div class="auth-intro"><button class="text-button" type="button" data-action="navigate" data-view="explore">← Back to explore</button><h1>Start with your shop details.</h1><p>A business profile is public. Payment details are private and are only added to a one-to-one message after you accept an order.</p>
              <div class="auth-points"><div class="auth-point"><span class="point-mark">✓</span><span>Phone, service area, and offers appear on your public profile.</span></div><div class="auth-point"><span class="point-mark">✓</span><span>Bank details are never shown in the public directory.</span></div><div class="auth-point"><span class="point-mark">✓</span><span>New requests remain pending until you decide.</span></div></div>
            </div>
            <div class="panel form-card">
              <h2>Create a business account</h2><p>Use a unique username and a password of at least 8 characters.</p>
              <form id="signupForm">
                <div class="form-grid">
                  <div class="field"><label for="signupOwner">Your name</label><input id="signupOwner" name="ownerName" autocomplete="name" maxlength="80" required /></div>
                  <div class="field"><label for="signupUsername">Username</label><input id="signupUsername" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9._-]+" title="Use letters, numbers, dots, underscores or hyphens." required /></div>
                  <div class="field full"><label for="signupPassword">Password</label><input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" required /><span class="field-hint">The password itself is never saved by this browser prototype.</span></div>
                  <div class="form-divider"></div>
                  <div class="field full"><label for="signupBusiness">Business name</label><input id="signupBusiness" name="businessName" maxlength="100" required /></div>
                  <div class="field"><label for="signupCategory">Business type</label><select id="signupCategory" name="category" required>
                    <option value="Food & catering">Food &amp; catering</option><option value="Fashion & tailoring">Fashion &amp; tailoring</option><option value="Events">Events</option><option value="Market goods">Market goods</option><option value="Home & services">Home &amp; services</option>
                  </select></div>
                  <div class="field"><label for="signupCurrency">Price currency</label><select id="signupCurrency" name="currency"><option value="GHS">GHS · Ghanaian cedi</option><option value="NGN">NGN · Nigerian naira</option><option value="USD">USD · US dollar</option><option value="EUR">EUR · euro</option><option value="GBP">GBP · pound sterling</option></select></div>
                  <div class="field"><label for="signupPhone">Business phone / WhatsApp</label><input id="signupPhone" name="phone" type="tel" autocomplete="tel" placeholder="+233 20 000 0000" maxlength="30" required /></div>
                  <div class="field"><label for="signupLocation">Location / service area</label><input id="signupLocation" name="location" autocomplete="address-level2" maxlength="100" placeholder="Area, city" required /></div>
                  <div class="field full"><label for="signupServices">Services you offer</label><textarea id="signupServices" name="services" maxlength="300" placeholder="Catering, event trays, celebration cakes" required></textarea></div>
                  <div class="field full"><label for="signupAbout">A short business introduction <span class="optional">(optional)</span></label><textarea id="signupAbout" name="about" maxlength="400" placeholder="What should customers know about working with you?"></textarea></div>
                  <div class="form-divider"></div>
                  <div class="field"><label for="signupBank">Bank / payment provider</label><input id="signupBank" name="bankName" autocomplete="off" maxlength="80" required /></div>
                  <div class="field"><label for="signupAccountName">Account name</label><input id="signupAccountName" name="accountName" autocomplete="off" maxlength="100" required /></div>
                  <div class="field full"><label for="signupAccountNumber">Account number or payment handle</label><input id="signupAccountNumber" name="accountNumber" autocomplete="off" maxlength="80" required /></div>
                </div>
                <div class="secure-note">Sensitive-data warning: this demo encrypts payment details in this browser with a key derived from your password, but there is no server, backup, or verified security boundary. Do not enter real bank details; use test data only.</div>
                <div class="form-actions"><button class="text-button" type="button" data-action="show-login">I already have an account</button><button class="button" type="submit">Create account</button></div>
              </form>
            </div>
          </section>`;
        }

        function orderSort(a, b) {
          const statusOrder = { pending: 0, accepted: 1, done: 2, declined: 3 };
          const statusDiff = (statusOrder[a.status] ?? 4) - (statusOrder[b.status] ?? 4);
          return statusDiff || (new Date(a.dueAt).getTime() - new Date(b.dueAt).getTime());
        }

        function renderReminders(orders) {
          const upcoming = orders.filter(order => order.status === "accepted")
            .filter(order => (new Date(order.dueAt).getTime() - Date.now()) < 24 * 60 * 60 * 1000)
            .sort((a, b) => new Date(a.dueAt) - new Date(b.dueAt));
          return `<aside class="reminder-panel"><h3>Due-date watch</h3><p>In-app reminder when you open this studio. BizFlow cannot send background alerts or WhatsApp messages in this prototype.</p>
            ${upcoming.length ? `<div class="reminder-list">${upcoming.map(order => `<div class="reminder-item"><span class="reminder-clock" aria-hidden="true">◷</span><span><strong>${escapeHtml(order.productName)}</strong> for ${escapeHtml(order.customerName)} · ${escapeHtml(relativeDeadline(order.dueAt))}</span></div>`).join("")}</div>` : `<p style="margin-top:9px;">No accepted orders due in the next 24 hours.</p>`}
          </aside>`;
        }

        function renderStudio() {
          const business = currentBusiness();
          if (!business) {
            route = "auth";
            return renderAuth();
          }
          const orders = allBusinessOrders(business.id).sort(orderSort);
          const pending = orders.filter(order => order.status === "pending");
          const accepted = orders.filter(order => order.status === "accepted");
          const completed = orders.filter(order => order.status === "done");
          const completedProfit = completed.reduce((total, order) => total + order.quantity * (Number(order.price) - (Number(order.cost) || 0)), 0);
          const expected = accepted.reduce((total, order) => total + order.quantity * Number(order.price), 0);
          return `<section>
            <div class="page-heading"><div><h1>${escapeHtml(business.name)}</h1><p>Business studio · requests, schedule, and completed work in one place.</p></div><div class="heading-actions"><button class="button secondary" type="button" data-action="open-own-profile">View public profile</button><button class="button" type="button" data-action="open-product-dialog">＋ Add an offer</button></div></div>
            <div class="stat-strip" aria-label="Business summary">
              <div class="stat accent"><span class="stat-label">Needs a decision</span><strong>${pending.length}</strong><small>Requests awaiting you</small></div>
              <div class="stat"><span class="stat-label">On the schedule</span><strong>${accepted.length}</strong><small>${formatMoney(expected, business.currency)} accepted value</small></div>
              <div class="stat"><span class="stat-label">Marked done</span><strong>${completed.length}</strong><small>Completed orders</small></div>
              <div class="stat"><span class="stat-label">Estimated profit</span><strong>${formatMoney(completedProfit, business.currency)}</strong><small>Done orders with entered costs</small></div>
            </div>
            <div class="split-layout">
              <section class="panel panel-pad">
                <div class="panel-title"><div><h2>Order desk</h2><p>Accept or decline each request; accepted work stays pending until marked done.</p></div><span class="business-category">${orders.length} total</span></div>
                ${orders.length ? `<div class="order-list">${orders.map(order => orderCard(order, true)).join("")}</div>` :
                  `<div class="empty-state"><strong>Your order desk is clear.</strong><p>Add an offer and share your profile to get started.</p><button class="button" type="button" data-action="open-product-dialog">Add an offer</button></div>`}
              </section>
              <div class="side-stack">${renderReminders(orders)}
                <section class="panel panel-pad"><div class="panel-title"><div><h3>Your public offers</h3><p>${business.products.length} products and services</p></div></div>
                  ${business.products.slice(0,3).map(product => `<div class="info-row"><span>${escapeHtml(product.name)}</span><strong>${formatMoney(product.price, business.currency)}</strong></div>`).join("")}
                  ${business.products.length > 3 ? `<button type="button" class="text-button" data-action="open-own-profile">View all offers →</button>` : ""}
                  <button type="button" class="button secondary small" data-action="open-product-dialog" style="margin-top:12px;">＋ Add offer</button>
                </section>
                <section class="panel panel-pad"><div class="panel-title"><div><h3>Payment privacy</h3><p>Not shown on your public profile.</p></div></div>
                  <p style="margin:0;color:var(--muted);font-size:12px;">${sessionBankDetails?.accountNumber ? "Payment details are unlocked for this sign-in only. Choose a customer message to share them privately." : "Payment details are locked or unavailable. Sign in again to unlock your details, or contact the customer directly."}</p>
                </section>
              </div>
            </div>
            <p class="prototype-footnote">Studio data is local to this browser and has no server backup. Profit is an estimate based only on optional costs you entered; it is not a bank balance or accounting record.</p>
          </section>`;
        }

        function renderRoute() {
          if (route === "explore") return renderExplore();
          if (route === "business") return renderBusinessProfile();
          if (route === "my-orders") return renderCustomerOrders();
          if (route === "signup") return renderSignup();
          if (route === "studio") return renderStudio();
          return renderAuth();
        }

        function renderApp(preserveSearch = false) {
          const activeSearch = preserveSearch ? document.getElementById("globalSearch") : null;
          const selection = activeSearch && activeSearch === document.activeElement ? activeSearch.selectionStart : null;
          app.innerHTML = shellMarkup();
          if (selection !== null) {
            const nextSearch = document.getElementById("globalSearch");
            nextSearch?.focus();
            nextSearch?.setSelectionRange(selection, selection);
          }
        }

        function navigate(view) {
          if (view === "studio" && !currentBusiness()) view = "auth";
          if (view === "auth" && currentBusiness()) view = "studio";
          route = ({ orders: "my-orders" })[view] || view;
          renderApp();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function bytesToBase64(bytes) {
          let binary = "";
          for (const byte of new Uint8Array(bytes)) binary += String.fromCharCode(byte);
          return btoa(binary);
        }

        function base64ToBytes(value) {
          const binary = atob(value);
          return Uint8Array.from(binary, character => character.charCodeAt(0));
        }

        async function derivePasswordBits(password, salt) {
          if (!window.crypto?.subtle) throw new Error("Secure browser encryption is unavailable. Open BizFlow in a modern browser over HTTPS or localhost.");
          const keyMaterial = await crypto.subtle.importKey("raw", encoder.encode(password), "PBKDF2", false, ["deriveBits"]);
          return crypto.subtle.deriveBits({ name: "PBKDF2", salt, iterations: PBKDF2_ITERATIONS, hash: "SHA-256" }, keyMaterial, 256);
        }

        async function encryptBankDetails(password, bank) {
          const salt = crypto.getRandomValues(new Uint8Array(16));
          const iv = crypto.getRandomValues(new Uint8Array(12));
          const bits = await derivePasswordBits(password, salt);
          const aesKey = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["encrypt"]);
          const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, aesKey, encoder.encode(JSON.stringify(bank)));
          return { salt: bytesToBase64(salt), verifier: bytesToBase64(bits), bankIv: bytesToBase64(iv), bankCipher: bytesToBase64(ciphertext) };
        }

        function timingSafeEqual(first, second) {
          if (first.length !== second.length) return false;
          let difference = 0;
          for (let index = 0; index < first.length; index += 1) difference |= first[index] ^ second[index];
          return difference === 0;
        }

        async function verifyAndUnlock(business, password) {
          const bits = await derivePasswordBits(password, base64ToBytes(business.salt));
          if (!timingSafeEqual(new Uint8Array(bits), base64ToBytes(business.verifier))) return false;
          const aesKey = await crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"]);
          try {
            const clear = await crypto.subtle.decrypt({ name: "AES-GCM", iv: base64ToBytes(business.bankIv) }, aesKey, base64ToBytes(business.bankCipher));
            sessionBankDetails = JSON.parse(decoder.decode(clear));
          } catch (error) {
            console.error("Payment details could not be decrypted after password verification.", error);
            throw new Error("These payment details could not be unlocked. Check that the saved data has not been changed.");
          }
          return true;
        }

        function setSession(businessId) {
          sessionBusinessId = businessId;
          const business = currentBusiness();
          if (business?.demo) sessionBankDetails = null;
          route = "studio";
          renderApp();
          showToast(business?.demo ? "Synthetic demo studio opened. No live orders or messages are connected." : `Welcome back, ${business?.ownerName || "owner"}.`);
        }

        function setMinimumOrderDate() {
          const input = document.getElementById("orderDue");
          if (!input) return;
          const localNow = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
          input.min = localNow.toISOString().slice(0, 16);
          const tomorrow = new Date(localNow.getTime() + 24 * 60 * 60 * 1000);
          input.value = tomorrow.toISOString().slice(0, 16);
        }

        function openOrderForm(businessId, productId) {
          const business = businessById(businessId);
          const product = business?.products.find(item => item.id === productId);
          if (!business || !product) {
            showToast("That offer is no longer available. Refresh the business profile and try again.", "error");
            return;
          }
          const form = document.getElementById("orderForm");
          form.elements.businessId.value = businessId;
          form.elements.productId.value = productId;
          document.getElementById("orderDialogSubtitle").textContent = `${business.name} · ${business.location}`;
          document.getElementById("orderProductSummary").textContent = `${product.name} · ${formatMoney(product.price, business.currency)} each. The owner confirms availability and final timing.`;
          setMinimumOrderDate();
          orderDialog.showModal();
          document.getElementById("orderCustomer").focus();
        }

        function saveOrder(form) {
          const fields = new FormData(form);
          const business = businessById(String(fields.get("businessId")));
          const product = business?.products.find(item => item.id === String(fields.get("productId")));
          const quantity = Number(fields.get("quantity"));
          const dueDate = new Date(String(fields.get("dueAt")));
          if (!business || !product || !Number.isInteger(quantity) || quantity < 1 || quantity > 99 || Number.isNaN(dueDate.getTime())) {
            throw new Error("Check the selected offer, quantity, and requested date and time.");
          }
          const order = {
            id: randomId("order"),
            businessId: business.id,
            productId: product.id,
            productName: product.name,
            customerName: String(fields.get("customerName")).trim(),
            customerPhone: String(fields.get("customerPhone")).trim(),
            quantity,
            price: Number(product.price),
            cost: Number(product.cost) || 0,
            currency: business.currency,
            fulfilment: String(fields.get("fulfilment")),
            dueAt: dueDate.toISOString(),
            note: String(fields.get("note") || "").trim(),
            status: "pending",
            demo: false,
            createdAt: new Date().toISOString()
          };
          store.orders.push(order);
          localOrderIds.add(order.id);
          try {
            persistStore();
          } catch (error) {
            store.orders.pop();
            localOrderIds.delete(order.id);
            throw error;
          }
          orderDialog.close();
          route = "my-orders";
          renderApp();
          const link = toWhatsApp(business.phone, orderRequestMessage(order, business));
          showToast("Request saved on this browser. Send the message to contact the owner.", "success",
            link ? { href: link, label: "Open the WhatsApp message" } : null);
          if (!link) showToast("Request saved locally, but the business phone needs an international country code for a WhatsApp link.", "error");
        }

        function makeProduct(form) {
          const business = currentBusiness();
          if (!business) throw new Error("Sign in to your business account before adding an offer.");
          const fields = new FormData(form);
          const price = Number(fields.get("price"));
          const costValue = String(fields.get("cost") || "");
          const cost = costValue ? Number(costValue) : null;
          if (!String(fields.get("name")).trim() || !Number.isFinite(price) || price <= 0 ||
              (cost !== null && (!Number.isFinite(cost) || cost < 0))) {
            throw new Error("Enter an offer name and a valid price; optional cost must be zero or more.");
          }
          const product = {
            id: randomId("offer"),
            name: String(fields.get("name")).trim(),
            price,
            cost,
            description: String(fields.get("description") || "").trim(),
            icon: String(fields.get("icon") || categoryIcons[business.category] || "✳")
          };
          business.products.push(product);
          try {
            persistStore();
          } catch (error) {
            business.products.pop();
            throw error;
          }
          productDialog.close();
          renderApp();
          showToast(`${product.name} is now on your public profile.`);
        }

        function updateOrder(id, status) {
          const business = currentBusiness();
          const order = store.orders.find(item => item.id === id && item.businessId === business?.id);
          if (!business || !order) throw new Error("That order is not available in this studio.");
          if (status === "accepted" && order.status !== "pending") throw new Error("Only a pending request can be accepted.");
          if (status === "declined" && order.status !== "pending") throw new Error("Only a pending request can be declined.");
          if (status === "done" && order.status !== "accepted") throw new Error("Accept and schedule this request before marking it done.");
          const previousStatus = order.status;
          order.status = status;
          order.updatedAt = new Date().toISOString();
          try {
            persistStore();
          } catch (error) {
            order.status = previousStatus;
            throw error;
          }
          renderApp();
          if (status === "accepted") showToast("Order accepted and added to your schedule. Use Message customer to confirm the plan.");
          if (status === "declined") showToast("Request declined in this browser. Contact the customer separately if needed.");
          if (status === "done") {
            const profit = order.quantity * (Number(order.price) - (Number(order.cost) || 0));
            showToast(`Order marked done. Estimated profit: ${formatMoney(profit, order.currency)}. This is not a bank-balance update.`);
          }
        }

        function copyText(value) {
          if (!navigator.clipboard?.writeText) {
            showToast("Clipboard access is unavailable in this browser. Copy the customer's details manually.", "error");
            return;
          }
          navigator.clipboard.writeText(value).then(
            () => showToast("Confirmation copied. Paste it into your WhatsApp conversation."),
            error => {
              console.error("Could not copy the WhatsApp confirmation.", error);
              showToast("Could not copy the confirmation. Open the customer chat and type it there.", "error");
            }
          );
        }

        app.addEventListener("input", event => {
          if (event.target.id === "globalSearch") {
            searchTerm = event.target.value.trim();
            if (route === "explore") renderApp(true);
          }
        });

        document.addEventListener("click", event => {
          const button = event.target.closest("[data-action]");
          if (!button) return;
          if (button.matches("a") && button.getAttribute("href") === "#") event.preventDefault();
          const action = button.dataset.action;
          try {
            if (action === "navigate") navigate(button.dataset.view);
            else if (action === "filter-category") {
              selectedCategory = button.dataset.category;
              route = "explore";
              renderApp();
            } else if (action === "clear-search") {
              selectedCategory = "All";
              searchTerm = "";
              renderApp();
            } else if (action === "focus-search") document.getElementById("globalSearch")?.focus();
            else if (action === "open-business") {
              selectedBusinessId = button.dataset.id;
              route = "business";
              renderApp();
              window.scrollTo({ top: 0, behavior: "smooth" });
            } else if (action === "request-order") openOrderForm(button.dataset.business, button.dataset.product);
            else if (action === "open-product-dialog") {
              document.getElementById("productForm").reset();
              productDialog.showModal();
              document.getElementById("productName").focus();
            } else if (action === "close-dialog") button.closest("dialog")?.close();
            else if (action === "demo-login") setSession("sample-table");
            else if (action === "show-signup") { route = "signup"; renderApp(); }
            else if (action === "show-login") { route = "auth"; renderApp(); }
            else if (action === "logout") {
              sessionBusinessId = null;
              sessionBankDetails = null;
              route = "explore";
              renderApp();
              showToast("Signed out. Your business remains saved in this browser.");
            } else if (action === "accept-order") updateOrder(button.dataset.id, "accepted");
            else if (action === "decline-order") updateOrder(button.dataset.id, "declined");
            else if (action === "complete-order") updateOrder(button.dataset.id, "done");
            else if (action === "copy-customer-message") {
              const order = store.orders.find(item => item.id === button.dataset.id);
              if (!order) throw new Error("That order is no longer available.");
              copyText(acceptedMessage(order));
            } else if (action === "open-own-profile") {
              const business = currentBusiness();
              if (!business) throw new Error("Sign in to view your business profile.");
              selectedBusinessId = business.id;
              route = "business";
              renderApp();
            }
          } catch (error) {
            showToast(error.message || "That action could not be completed. Please try again.", "error");
          }
        });

        document.addEventListener("submit", async event => {
          event.preventDefault();
          const form = event.target;
          const submitButton = form.querySelector('button[type="submit"]');
          if (submitButton) submitButton.disabled = true;
          try {
            if (form.id === "orderForm") saveOrder(form);
            else if (form.id === "productForm") makeProduct(form);
            else if (form.id === "loginForm") {
              const fields = new FormData(form);
              const username = String(fields.get("username")).trim().toLowerCase();
              const password = String(fields.get("password"));
              const business = store.businesses.find(item => item.username.toLowerCase() === username && !item.demo);
              if (!business) throw new Error("No saved account matches that username. Check it or create an account in this browser.");
              const unlocked = await verifyAndUnlock(business, password);
              if (!unlocked) throw new Error("That password did not match. Try again or create a new account.");
              setSession(business.id);
            } else if (form.id === "signupForm") {
              if (!persistenceAvailable) throw new Error("Browser storage is currently unavailable. Enable storage and refresh before creating an account.");
              const fields = new FormData(form);
              const username = String(fields.get("username")).trim();
              const usernameKey = username.toLowerCase();
              if (store.businesses.some(item => item.username.toLowerCase() === usernameKey)) throw new Error("That username is already in use in this browser. Choose another.");
              const password = String(fields.get("password"));
              if (password.length < 8) throw new Error("Use a password with at least 8 characters.");
              const bank = {
                bankName: String(fields.get("bankName")).trim(),
                accountName: String(fields.get("accountName")).trim(),
                accountNumber: String(fields.get("accountNumber")).trim()
              };
              const protectedBank = await encryptBankDetails(password, bank);
              const business = {
                id: randomId("business"),
                username,
                ownerName: String(fields.get("ownerName")).trim(),
                name: String(fields.get("businessName")).trim(),
                category: String(fields.get("category")),
                location: String(fields.get("location")).trim(),
                phone: String(fields.get("phone")).trim(),
                services: String(fields.get("services")).trim(),
                about: String(fields.get("about") || "").trim(),
                currency: String(fields.get("currency") || "GHS"),
                products: [],
                demo: false,
                ...protectedBank
              };
              store.businesses.push(business);
              try {
                persistStore();
              } catch (error) {
                store.businesses.pop();
                throw error;
              }
              sessionBusinessId = business.id;
              sessionBankDetails = bank;
              route = "studio";
              renderApp();
              showToast(`Your BizFlow account is ready, ${business.ownerName}. Add your first offer to start.`);
            }
          } catch (error) {
            console.error("BizFlow form action failed.", error);
            showToast(error.message || "The form could not be completed. Review the fields and try again.", "error");
          } finally {
            if (submitButton?.isConnected) submitButton.disabled = false;
          }
        });

        orderDialog.addEventListener("click", event => {
          if (event.target === orderDialog) orderDialog.close();
        });
        productDialog.addEventListener("click", event => {
          if (event.target === productDialog) productDialog.close();
        });
        window.addEventListener("storage", event => {
          if (event.key === STORAGE_KEY) {
            showToast("BizFlow data changed in another tab. Refresh to see the latest update.", "error");
          }
        });

        if (!persistenceAvailable) {
          showToast("Saved data could not be read. Showing synthetic sample listings; new changes may not persist.", "error");
        }
        renderApp();
      })();
    </script>
  </body>
</html>
