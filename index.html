<!doctype html>
<!--
THESIS: BizFlow turns a request into a dated work ticket; it refuses to treat a marketplace listing as an order.
OWN-WORLD: Ink-blue ledger rails, bright cobalt action stamps, lime timing marks, and ruled white work slips.
STORY: Customers discover real offers and request a slot; owners decide, schedule, and close each job.
FIRST VIEWPORT: A left-hand work rail frames a live order-route illustration beside search and nearby maker listings.
FORM: Work-order ledger, first choice; compact shop-counter job book; direction seed unavailable in this Node-free workspace.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14243a" />
    <meta name="description" content="Discover local businesses, request an order, and keep every job moving with BizFlow." />
    <title>BizFlow — good work, clearly ordered</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17263b;
        --ink-soft: #41536b;
        --muted: #64748b;
        --paper: #ffffff;
        --canvas: #f2f5f8;
        --line: #dce3eb;
        --line-dark: #31455e;
        --nav: #14243a;
        --nav-muted: #a7b5c8;
        --blue: #275ee8;
        --blue-dark: #1849ca;
        --blue-pale: #e9efff;
        --lime: #d9f36a;
        --lime-ink: #34420b;
        --orange: #e37b42;
        --green: #187c52;
        --green-pale: #e8f6ee;
        --red: #b5413e;
        --red-pale: #fff0ef;
        --radius: 16px;
        --shadow: 0 16px 40px rgba(20, 36, 58, 0.08);
        --focus: 0 0 0 3px rgba(39, 94, 232, 0.26);
      }

      * { box-sizing: border-box; }

      html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        font-size: 15px;
        line-height: 1.5;
      }

      button, input, select, textarea { font: inherit; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { color: inherit; }
      a { color: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
        outline: none;
        box-shadow: var(--focus);
      }

      .app-shell { min-height: 100vh; }

      .side-rail {
        position: fixed;
        inset: 0 auto 0 0;
        z-index: 20;
        display: flex;
        width: 244px;
        flex-direction: column;
        padding: 26px 16px 18px;
        background: var(--nav);
        color: white;
      }

      .brand-lockup {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 10px 28px;
        color: white;
        text-decoration: none;
      }

      .brand-mark {
        position: relative;
        display: grid;
        width: 38px;
        height: 38px;
        flex: 0 0 auto;
        place-items: center;
        overflow: hidden;
        border-radius: 11px 11px 11px 4px;
        background: var(--lime);
        color: var(--nav);
        font-size: 21px;
        font-weight: 900;
        letter-spacing: -0.08em;
      }

      .brand-name { font-size: 19px; font-weight: 800; letter-spacing: -0.04em; }
      .brand-caption { display: block; color: var(--nav-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.02em; }

      .rail-label {
        padding: 0 11px;
        margin: 7px 0 10px;
        color: #8293aa;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .rail-nav { display: grid; gap: 5px; }

      .rail-link {
        display: flex;
        min-height: 46px;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        color: var(--nav-muted);
        cursor: pointer;
        text-align: left;
        transition: background 160ms ease, color 160ms ease;
      }

      .rail-link:hover { background: rgba(255,255,255,0.07); color: white; }
      .rail-link.active { background: #233a59; color: white; }
      .rail-link.active .rail-icon { color: var(--lime); }
      .rail-icon { display: grid; width: 20px; place-items: center; color: #b9c6d6; font-size: 17px; }
      .rail-link span:last-child { flex: 1; }

      .rail-count {
        min-width: 22px;
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--lime);
        color: var(--lime-ink);
        font-size: 11px;
        font-weight: 800;
        text-align: center;
      }

      .rail-spacer { flex: 1; }

      .rail-demo {
        padding: 15px 14px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px;
        background: rgba(255,255,255,.045);
      }

      .rail-demo strong { display: block; margin-bottom: 4px; font-size: 12px; }
      .rail-demo p { margin: 0; color: var(--nav-muted); font-size: 11px; line-height: 1.55; }
      .rail-foot { display: flex; align-items: center; gap: 8px; padding: 18px 10px 0; color: #9eacc0; font-size: 11px; }
      .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }

      .workspace { min-height: 100vh; margin-left: 244px; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 15;
        display: flex;
        min-height: 76px;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 13px clamp(22px, 4vw, 58px);
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,.96);
      }

      .mobile-brand { display: none; }
      .search-box { position: relative; width: min(390px, 46vw); }
      .search-box input {
        width: 100%;
        height: 42px;
        padding: 0 14px 0 39px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--ink);
      }
      .search-box input::placeholder { color: #77869a; }
      .search-symbol { position: absolute; top: 9px; left: 13px; color: #607087; font-size: 18px; pointer-events: none; }
      .topbar-actions { display: flex; align-items: center; gap: 10px; }
      .topbar-note { color: var(--muted); font-size: 12px; }

      .content {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 34px clamp(22px, 4vw, 58px) 76px;
      }

      .page-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      .page-heading h1 {
        max-width: 800px;
        margin: 0;
        font-size: clamp(29px, 3.2vw, 43px);
        font-weight: 780;
        letter-spacing: -0.055em;
        line-height: 1.08;
      }

      .page-heading p { max-width: 66ch; margin: 10px 0 0; color: var(--muted); font-size: 15px; }
      .heading-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--blue);
        color: white;
        cursor: pointer;
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
        transition: background 140ms ease, transform 140ms ease, border-color 140ms ease;
      }

      .button:hover { transform: translateY(-1px); background: var(--blue-dark); }
      .button:active { transform: translateY(0); }
      .button.secondary { border-color: var(--line); background: white; color: var(--ink); }
      .button.secondary:hover { border-color: #aebdcd; background: #f8fafc; }
      .button.dark { background: var(--nav); }
      .button.dark:hover { background: #253b58; }
      .button.danger { background: var(--red-pale); color: var(--red); }
      .button.danger:hover { background: #ffdfdc; }
      .button.small { min-height: 34px; padding: 0 11px; font-size: 12px; }
      .button:disabled { transform: none; opacity: .48; cursor: not-allowed; }

      .route-board {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, .92fr);
        min-height: 260px;
        overflow: hidden;
        margin-bottom: 36px;
        border-radius: 15px;
        background: var(--nav);
        color: white;
      }

      .route-copy { position: relative; z-index: 1; padding: clamp(27px, 4vw, 50px); }
      .route-copy h2 { max-width: 470px; margin: 0; font-size: clamp(28px, 3.5vw, 46px); font-weight: 760; letter-spacing: -.055em; line-height: 1.07; }
      .route-copy p { max-width: 430px; margin: 14px 0 22px; color: #b6c4d6; font-size: 14px; }
      .route-copy .button { background: var(--lime); color: var(--lime-ink); }
      .route-copy .button:hover { background: #e5ff78; }

      .ticket-stage {
        position: relative;
        display: flex;
        min-height: 260px;
        align-items: center;
        justify-content: center;
        padding: 28px 32px 28px 4px;
        background:
          linear-gradient(135deg, transparent 0 55%, rgba(39,94,232,.28) 55% 100%),
          linear-gradient(45deg, transparent 0 74%, rgba(217,243,106,.1) 74% 100%);
      }

      .ticket {
        width: min(390px, 100%);
        transform: rotate(-2.2deg);
        padding: 20px 21px 17px;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 18px 45px rgba(0,0,0,.24);
      }

      .ticket-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding-bottom: 13px; border-bottom: 1px dashed #c9d2dc; }
      .ticket-head small { display: block; color: #718198; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .ticket-head strong { display: block; margin-top: 3px; font-size: 16px; }
      .ticket-stamp { padding: 5px 8px; transform: rotate(4deg); border: 1px solid var(--blue); color: var(--blue); font-size: 10px; font-weight: 900; letter-spacing: .08em; }
      .ticket-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; padding: 17px 0 12px; }
      .ticket-step { position: relative; padding-top: 15px; color: #718198; font-size: 10px; font-weight: 700; }
      .ticket-step::before { position: absolute; top: 0; left: 0; width: 8px; height: 8px; border: 2px solid #c2cedb; border-radius: 50%; background: white; content: ""; }
      .ticket-step:not(:last-child)::after { position: absolute; top: 3px; left: 11px; width: calc(100% - 11px); height: 2px; background: #dfe5ec; content: ""; }
      .ticket-step.current { color: var(--ink); }
      .ticket-step.current::before { z-index: 1; border-color: var(--blue); background: var(--blue); }
      .ticket-meta { display: flex; justify-content: space-between; gap: 10px; padding-top: 11px; border-top: 1px solid #e6ebf0; color: #596b82; font-size: 11px; }
      .ticket-meta strong { color: var(--ink); }

      .section-heading {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin: 30px 0 15px;
      }

      .section-heading h2 { margin: 0; font-size: 22px; font-weight: 760; letter-spacing: -.04em; }
      .section-heading p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
      .text-button { padding: 7px 0; border: 0; background: none; color: var(--blue); cursor: pointer; font-size: 12px; font-weight: 750; text-decoration: none; }

      .filter-row { display: flex; align-items: center; gap: 8px; overflow-x: auto; padding: 1px 1px 12px; scrollbar-width: thin; }
      .filter-chip { min-height: 35px; flex: 0 0 auto; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: white; color: #52647a; cursor: pointer; font-size: 12px; font-weight: 700; }
      .filter-chip.active { border-color: var(--nav); background: var(--nav); color: white; }
      .filter-chip:hover:not(.active) { border-color: #a8b7c8; }

      .business-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .business-card {
        display: flex;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper);
        transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      }
      .business-card:hover { transform: translateY(-3px); border-color: #b9c7d6; box-shadow: var(--shadow); }
      .business-art { position: relative; display: flex; height: 148px; align-items: flex-end; justify-content: space-between; overflow: hidden; padding: 14px 16px; background: #dce6f9; }
      .business-art::before, .business-art::after { position: absolute; content: ""; }
      .business-art::before { top: -40px; right: 22px; width: 160px; height: 160px; border: 1px solid rgba(255,255,255,.56); border-radius: 50%; }
      .business-art::after { right: 75px; bottom: -96px; width: 180px; height: 180px; border: 1px solid rgba(255,255,255,.47); border-radius: 50%; }
      .business-art.food { background: #f1c99a; }
      .business-art.tailoring { background: #91a2d4; }
      .business-art.events { background: #dcb0cb; }
      .business-art.market { background: #a6c4a4; }
      .business-art.service { background: #8abac5; }
      .art-label { position: relative; z-index: 1; color: rgba(23,38,59,.78); font-size: 11px; font-weight: 850; letter-spacing: .1em; text-transform: uppercase; }
      .art-symbol { position: absolute; top: 24px; right: 34px; z-index: 1; display: grid; width: 83px; height: 83px; place-items: center; transform: rotate(7deg); border: 1px solid rgba(255,255,255,.65); border-radius: 50%; background: rgba(255,255,255,.2); color: #14243a; font-size: 38px; }
      .demo-tag { position: relative; z-index: 1; padding: 4px 7px; border-radius: 4px; background: rgba(255,255,255,.78); color: var(--ink); font-size: 9px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
      .business-card-body { display: flex; flex: 1; flex-direction: column; padding: 15px 16px 16px; }
      .business-title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .business-title-row h3 { margin: 0; font-size: 17px; font-weight: 760; letter-spacing: -.03em; line-height: 1.25; }
      .business-category { color: var(--blue-dark); font-size: 10px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
      .business-summary { min-height: 43px; margin: 7px 0 14px; color: var(--muted); font-size: 12px; line-height: 1.55; }
      .business-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid #edf0f3; }
      .business-place { color: #596b82; font-size: 11px; }
      .business-place strong { color: var(--ink); font-weight: 700; }
      .open-business { padding: 0; border: 0; background: none; color: var(--blue); cursor: pointer; font-size: 12px; font-weight: 800; white-space: nowrap; }
      .open-business:hover { color: var(--blue-dark); text-decoration: underline; }

      .split-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(260px, .75fr); gap: 18px; align-items: start; }
      .panel { min-width: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); }
      .panel-pad { padding: 20px; }
      .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
      .panel-title h2, .panel-title h3 { margin: 0; font-size: 17px; font-weight: 760; letter-spacing: -.025em; }
      .panel-title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
      .stat-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 11px; margin-bottom: 19px; }
      .stat { min-width: 0; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: white; }
      .stat-label { display: block; color: var(--muted); font-size: 11px; font-weight: 650; }
      .stat strong { display: block; margin-top: 3px; overflow: hidden; font-size: clamp(19px, 2vw, 25px); font-weight: 780; letter-spacing: -.045em; text-overflow: ellipsis; white-space: nowrap; }
      .stat small { display: block; margin-top: 3px; color: #65768a; font-size: 10px; }
      .stat.accent { border-color: #d1e0ff; background: #f1f5ff; }
      .stat.accent strong { color: var(--blue-dark); }

      .order-list { display: grid; }
      .order-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; padding: 16px 0; border-top: 1px solid #e9edf2; }
      .order-row:first-child { border-top: 0; padding-top: 0; }
      .order-main { min-width: 0; }
      .order-titleline { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
      .order-titleline strong { font-size: 14px; }
      .order-details { display: flex; flex-wrap: wrap; gap: 5px 13px; margin-top: 5px; color: var(--muted); font-size: 11px; }
      .order-details span { overflow-wrap: anywhere; }
      .order-note { margin: 8px 0 0; color: #52647a; font-size: 12px; }
      .order-actions { display: flex; align-items: center; justify-content: flex-end; gap: 7px; flex-wrap: wrap; }
      .status { display: inline-flex; min-height: 22px; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; background: #edf1f5; color: #53657b; font-size: 10px; font-weight: 800; white-space: nowrap; }
      .status.pending { background: #fff1dc; color: #84561a; }
      .status.accepted { background: var(--blue-pale); color: #234cc0; }
      .status.done { background: var(--green-pale); color: var(--green); }
      .status.declined { background: var(--red-pale); color: var(--red); }
      .status.soon { background: var(--lime); color: var(--lime-ink); }
      .status.late { background: var(--red-pale); color: var(--red); }
      .reminder-panel { padding: 16px; border: 1px solid #d6e5a0; border-radius: 10px; background: #f3f8dc; }
      .reminder-panel h3 { margin: 0 0 8px; color: #34420b; font-size: 13px; }
      .reminder-panel p { margin: 0; color: #53612a; font-size: 11px; line-height: 1.55; }
      .reminder-list { display: grid; gap: 9px; margin-top: 11px; }
      .reminder-item { display: flex; align-items: flex-start; gap: 9px; color: #455320; font-size: 11px; }
      .reminder-clock { color: #536b13; font-size: 15px; line-height: 1; }
      .side-stack { display: grid; gap: 14px; }
      .empty-state { padding: 34px 16px; color: var(--muted); text-align: center; }
      .empty-state strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 14px; }
      .empty-state p { margin: 0 0 14px; font-size: 12px; }

      .auth-layout { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 22px; align-items: start; }
      .auth-intro { position: sticky; top: 100px; padding: 24px 12px 24px 0; }
      .auth-intro h1 { margin: 0; font-size: clamp(30px, 4vw, 48px); font-weight: 780; letter-spacing: -.06em; line-height: 1.05; }
      .auth-intro p { max-width: 46ch; color: var(--muted); }
      .auth-points { display: grid; gap: 12px; margin-top: 24px; }
      .auth-point { display: flex; align-items: flex-start; gap: 10px; color: #42546b; font-size: 13px; }
      .point-mark { display: grid; width: 22px; height: 22px; flex: 0 0 auto; place-items: center; border-radius: 6px; background: var(--lime); color: var(--lime-ink); font-weight: 900; }
      .form-card { padding: clamp(20px, 3vw, 32px); }
      .form-card h2 { margin: 0; font-size: 22px; letter-spacing: -.04em; }
      .form-card > p { margin: 6px 0 20px; color: var(--muted); font-size: 13px; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
      .field { display: grid; min-width: 0; gap: 6px; }
      .field.full { grid-column: 1 / -1; }
      .field label { color: #33475e; font-size: 12px; font-weight: 750; }
      .field label .optional { color: #7a899a; font-weight: 500; }
      .field input, .field select, .field textarea {
        width: 100%;
        min-height: 42px;
        padding: 9px 11px;
        border: 1px solid #cad4df;
        border-radius: 7px;
        background: white;
        color: var(--ink);
      }
      .field textarea { min-height: 82px; resize: vertical; }
      .field input::placeholder, .field textarea::placeholder { color: #8996a6; }
      .field-hint { color: #6a7a8e; font-size: 10px; line-height: 1.5; }
      .form-divider { grid-column: 1 / -1; height: 1px; margin: 2px 0; background: var(--line); }
      .form-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
      .form-actions .text-button { text-align: left; }
      .secure-note { margin-top: 18px; padding: 12px; border: 1px solid #ead8b2; border-radius: 7px; background: #fff8e9; color: #66532e; font-size: 11px; line-height: 1.55; }
      .auth-switch { display: flex; align-items: center; gap: 5px; margin-top: 17px; color: var(--muted); font-size: 12px; }
      .auth-switch button { padding: 4px; border: 0; background: none; color: var(--blue); cursor: pointer; font-weight: 800; }

      .profile-banner { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 20px; align-items: end; padding: clamp(23px, 3.5vw, 40px); border-radius: 13px; background: var(--nav); color: white; }
      .profile-banner .business-category { color: var(--lime); }
      .profile-banner h1 { max-width: 800px; margin: 8px 0 6px; font-size: clamp(28px, 3.5vw, 42px); letter-spacing: -.055em; line-height: 1.08; }
      .profile-banner p { max-width: 64ch; margin: 0; color: #c0cbda; }
      .profile-contact { display: flex; gap: 8px; flex-wrap: wrap; }
      .profile-contact .button.secondary { border-color: rgba(255,255,255,.32); background: transparent; color: white; }
      .profile-contact .button.secondary:hover { background: rgba(255,255,255,.09); }
      .profile-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 15px; color: #bfcbda; font-size: 12px; }
      .product-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; }
      .product-card { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: white; }
      .product-art { position: relative; display: grid; height: 124px; place-items: center; overflow: hidden; background: #e8effb; }

  <body>
    <div id="app"></div>
    <div id="toastRegion" class="toast-region" aria-live="polite" aria-atomic="false"></div>

    <dialog id="orderDialog" aria-labelledby="orderDialogTitle">
      <div class="dialog-head">
        <div>
          <h2 id="orderDialogTitle">Request an order</h2>
          <p id="orderDialogSubtitle"></p>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close order form">×</button>
      </div>
      <form id="orderForm" class="dialog-form">
        <input type="hidden" name="businessId" />
        <input type="hidden" name="productId" />
        <div id="orderProductSummary" class="dialog-summary"></div>
        <div class="form-grid" style="margin-top:14px;">
          <div class="field">
            <label for="orderCustomer">Your name</label>
            <input id="orderCustomer" name="customerName" autocomplete="name" maxlength="80" required />
          </div>
          <div class="field">
            <label for="orderPhone">WhatsApp / phone</label>
            <input id="orderPhone" name="customerPhone" type="tel" autocomplete="tel" placeholder="+233 20 000 0000" required />
            <span class="field-hint">Include your country code for the WhatsApp handoff.</span>
          </div>
          <div class="field">
            <label for="orderQuantity">Quantity</label>
            <input id="orderQuantity" name="quantity" type="number" min="1" max="99" value="1" required />
          </div>
          <div class="field">
            <label for="orderDue">Requested date &amp; time</label>
            <input id="orderDue" name="dueAt" type="datetime-local" required />
          </div>
          <div class="field full">
            <label for="orderFulfilment">Fulfilment</label>
            <select id="orderFulfilment" name="fulfilment" required>
              <option value="Pickup">Pickup</option>
              <option value="Delivery">Delivery</option>
              <option value="Discuss with owner">Discuss with owner</option>
            </select>
          </div>
          <div class="field full">
            <label for="orderNote">Order details <span class="optional">(optional)</span></label>
            <textarea id="orderNote" name="note" maxlength="400" placeholder="Size, colour, delivery area, or anything the owner should know"></textarea>
          </div>
        </div>
        <div class="dialog-actions">
          <button class="button secondary" type="button" data-action="close-dialog">Cancel</button>
          <button class="button" type="submit">Save request &amp; open WhatsApp</button>
        </div>
      </form>
    </dialog>

    <dialog id="productDialog" aria-labelledby="productDialogTitle">
      <div class="dialog-head">
        <div>
          <h2 id="productDialogTitle">Add an offer</h2>
          <p>Prices and optional costs stay in this browser demo.</p>
        </div>
        <button class="icon-button" type="button" data-action="close-dialog" aria-label="Close product form">×</button>
      </div>
      <form id="productForm" class="dialog-form">
        <div class="form-grid">
          <div class="field full">
            <label for="productName">Product or service</label>
            <input id="productName" name="name" maxlength="90" placeholder="e.g. Celebration cake" required />
          </div>
          <div class="field">
            <label for="productPrice">Price</label>
            <input id="productPrice" name="price" type="number" min="0.01" step="0.01" required />
          </div>
          <div class="field">
            <label for="productCost">Your cost <span class="optional">(optional)</span></label>
            <input id="productCost" name="cost" type="number" min="0" step="0.01" placeholder="For profit estimate" />
          </div>
          <div class="field">
            <label for="productIcon">Offer illustration</label>
            <select id="productIcon" name="icon">
              <option value="🍰">Cake</option>
              <option value="🧵">Tailoring</option>
              <option value="🎉">Event</option>
              <option value="🧺">Goods</option>
              <option value="🛠️">Service</option>
            </select>
          </div>
          <div class="field full">
            <label for="productDescription">Short description <span class="optional">(optional)</span></label>
            <textarea id="productDescription" name="description" maxlength="180" placeholder="What's included?"></textarea>

        <div class="dialog-actions">
          <button class="button secondary" type="button" data-action="close-dialog">Cancel</button>
          <button class="button" type="submit">Add to my profile</button>
        </div>
      </form>
    </dialog>

    <script>
      (() => {
        "use strict";

        const STORAGE_KEY = "bizflow.prototype.v1";
        const PBKDF2_ITERATIONS = 310000;
        const categories = ["All", "Food & catering", "Fashion & tailoring", "Events", "Market goods", "Home & services"];

        const seedBusinesses = [

              { id: "stitch-alter", name: "Trouser alterations", price: 65, cost: 18, description: "Typical turnaround confirmed by the owner.", icon: "🪡" }
            ]
          },
          {

            location: "Labone, Accra",
            phone: "+233 20 000 0103",
            services: "Small celebrations, table styling, event coordination",
            about: "Calm hands for the details that make a gathering feel like yours.",
            currency: "GHS",
            demo: true,
            products: [
              { id: "gather-table", name: "Intimate table styling", price: 850, cost: 520, description: "A starting price; scope confirmed before booking.", icon: "🕯️" },
              { id: "gather-plan", name: "Planning session", price: 200, cost: 30, description: "A focused hour to make a plan together.", icon: "📋" }
